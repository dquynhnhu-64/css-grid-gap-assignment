<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS grid-gap Property</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VÍ DỤ 1 -->
    <div class="example-section">
        <h2>Ví dụ 1: Thiết lập khoảng cách hàng và cột bằng nhau (grid-gap: 20px)</h2>
        <div class="grid-container grid-ex1">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
        </div>
    </div>

    <!-- VÍ DỤ 2 -->
    <div class="example-section">
        <h2>Ví dụ 2: Thiết lập khoảng cách hàng và cột khác nhau (grid-gap: 30px 10px)</h2>
        <div class="grid-container grid-ex2">
            <div>Ô 1</div>
            <div>Ô 2</div>
            <div>Ô 3</div>
            <div>Ô 4</div>
            <div>Ô 5</div>
            <div>Ô 6</div>
        </div>
    </div>

</body>
</html>
