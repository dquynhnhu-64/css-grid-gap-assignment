<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành flex-grow Property</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        /* Container đóng vai trò là Flex Container */
        .container {
            display: flex;
            background-color: #333;
            padding: 10px;
            border-radius: 8px;
            gap: 10px;
            height: 120px;
        }

        /* Các item bên trong container */
        .item {
            background-color: #4caf50;
            color: white;
            text-align: center;
            line-height: 100px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            
            /* Mặc định flex-grow là 0 (không tự mở rộng) */
            flex-grow: 0;
            /* Đặt chiều rộng cơ bản cho mỗi item */
            flex-basis: 80px; 
        }

        /* Áp dụng flex-grow cho div thứ 2 theo đúng yêu cầu đề bài */
        .item-2 {
            background-color: #ff9800; /* Đổi màu để dễ nhận biết */
            flex-grow: 1; /* Item thứ 2 sẽ phát triển để chiếm toàn bộ khoảng trống còn lại */
        }
    </style>
</head>
<body>

    <h2>Ví dụ về thuộc tính flex-grow (5 Flex Items)</h2>

    <div class="container">
        <div class="item item-1">Item 1</div>
        <div class="item item-2">Item 2 (flex-grow: 1)</div>
        <div class="item item-3">Item 3</div>
        <div class="item item-4">Item 4</div>
        <div class="item item-5">Item 5</div>
    </div>

</body>
</html>
